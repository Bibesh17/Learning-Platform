<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIN_PAGE</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <main>
      <div class="div">
        <h1>Seema Academy</h1>
        <p>
          Join Thousands of students<br />
          achieving their goals
        </p>
        <small>© 2026 Seema Academy. All rights reserved.</small>
      </div>
      <div class="login">
        <h1>Welcome</h1>
        <small>Welcome back! Please enter your details</small>
        <form action="logged_in.html" method="get">
          <label for="username">User Name</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your User Name"
            required
          />
          <br />
          <label for="email">Email</label><br>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />
          <br />
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          /><br />
          <input type="checkbox" id="check" name="check" />
          <label for="check">Remember me</label>
          <br />
          <button type="submit">Log in</button>
        </form>
        <small>
          Don't have an account?
          <a href="sign_up.html">Sign up for free</a>
        </small>
      </div>
    </main>
  </body>
</html>
